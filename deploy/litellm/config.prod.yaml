# Chat snapshots are deliberately dated. The embedding family has no dated snapshot.
model_list:
  - model_name: extract-vision
    litellm_params:
      model: openai/gpt-4.1-mini-2025-04-14
      api_base: os.environ/OPENAI_BASE_URL
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: chat
  - model_name: triage-reasoner
    litellm_params:
      model: openai/gpt-4.1-mini-2025-04-14
      api_base: os.environ/OPENAI_BASE_URL
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: chat
  - model_name: eval-judge
    litellm_params:
      model: openai/gpt-4.1-2025-04-14
      api_base: os.environ/OPENAI_BASE_URL
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: chat
  - model_name: embed
    litellm_params:
      model: openai/text-embedding-3-small
      api_base: os.environ/OPENAI_BASE_URL
      api_key: os.environ/OPENAI_API_KEY
      dimensions: 384
    model_info:
      mode: embedding

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  background_health_checks: false

router_settings:
  num_retries: 0
