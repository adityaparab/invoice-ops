# Bridge the application's virtual aliases to the developer's native LiteLLM proxy.
model_list:
  - model_name: extract-vision
    litellm_params:
      model: openai/glm-ocr
      api_base: os.environ/NATIVE_LITELLM_BASE_URL
      api_key: os.environ/NATIVE_LITELLM_API_KEY
    model_info:
      mode: chat
  - model_name: triage-reasoner
    litellm_params:
      model: openai/qwen38
      api_base: os.environ/NATIVE_LITELLM_BASE_URL
      api_key: os.environ/NATIVE_LITELLM_API_KEY
    model_info:
      mode: chat
  - model_name: eval-judge
    litellm_params:
      model: openai/compass-judger
      api_base: os.environ/NATIVE_LITELLM_BASE_URL
      api_key: os.environ/NATIVE_LITELLM_API_KEY
    model_info:
      mode: chat
  - model_name: embed
    litellm_params:
      model: openai/nomic-embed
      api_base: os.environ/NATIVE_LITELLM_BASE_URL
      api_key: os.environ/NATIVE_LITELLM_API_KEY
    model_info:
      mode: embedding

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  background_health_checks: false

router_settings:
  num_retries: 0
