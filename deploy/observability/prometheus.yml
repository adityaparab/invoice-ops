global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/invoiceops-alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: invoiceops-api
    metrics_path: /v1/metrics
    static_configs:
      - targets: ["api:8000"]
