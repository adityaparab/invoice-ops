name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
      RYUK_CONTAINER_IMAGE: testcontainers/ryuk:0.8.1@sha256:bf3f74a47dee0acda89aba4b2fc9c7fdcf994a084db02a2d06566f07baae022e
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.25"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Ruff lint and format
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Strict type checks
        run: uv run --no-sync mypy --strict

      - name: Offline unit tests
        run: uv run --no-sync pytest tests/unit -m unit --disable-socket --allow-unix-socket

      - name: Postgres and MinIO integration tests
        timeout-minutes: 5
        run: uv run --no-sync pytest tests/integration -m integration

      - name: Build distribution
        run: uv build

      - name: Validate and start Compose stack
        timeout-minutes: 5
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 120
          curl --fail --silent --show-error http://localhost:8000/healthz
          curl --fail --silent --show-error http://localhost:8000/readyz
          docker compose run --rm seed

      - name: Validate gateway startup and aliases without inference
        timeout-minutes: 5
        env:
          NATIVE_LITELLM_BASE_URL: http://127.0.0.1:9/v1
          NATIVE_LITELLM_API_KEY: synthetic-ci-no-provider-access
        run: |
          docker compose --profile gateway up -d --wait --wait-timeout 180 litellm
          docker compose exec -T litellm python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          request = Request(
              "http://127.0.0.1:4000/v1/models",
              headers={"Authorization": f"Bearer {os.environ['LITELLM_MASTER_KEY']}"},
          )
          with urlopen(request, timeout=5) as response:
              aliases = {model["id"] for model in json.load(response)["data"]}
          assert aliases == {"extract-vision", "triage-reasoner", "eval-judge", "embed"}
          PY

      - name: Compose diagnostics
        if: failure()
        run: docker compose --profile gateway logs --no-color

      - name: Clean up Compose services
        if: always()
        run: docker compose --profile gateway down --volumes --remove-orphans
