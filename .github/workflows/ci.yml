name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.12"
      RYUK_CONTAINER_IMAGE: testcontainers/ryuk:0.8.1@sha256:bf3f74a47dee0acda89aba4b2fc9c7fdcf994a084db02a2d06566f07baae022e
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.25"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend contract, types, and build
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
          git diff --exit-code -- openapi.json src/generated/api.ts
          npm run typecheck
          npm test
          npm run build

      - name: Ruff lint and format
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Strict type checks
        run: uv run --no-sync mypy --strict

      - name: Offline unit tests
        run: uv run --no-sync pytest tests/unit -m unit --disable-socket --allow-unix-socket

      - name: Prepare pinned MinIO image
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prepare_minio_image.sh

      - name: Postgres and MinIO integration tests
        timeout-minutes: 5
        run: uv run --no-sync pytest tests/integration -m integration

      - name: Build distribution
        run: uv build

      - name: Validate and start Compose stack
        timeout-minutes: 5
        run: |
          docker compose config --quiet
          docker compose --profile observability config --quiet
          docker compose up -d --build --wait --wait-timeout 120
          curl --fail --silent --show-error http://localhost:8000/healthz
          curl --fail --silent --show-error http://localhost:8000/readyz
          docker compose exec -T api python - <<'PY'
          import os
          import psycopg
          from invoiceops_agent.api.settings import ApiSettings

          owner_variables = ("INVOICEOPS_MIGRATION_DSN", "INVOICEOPS_CHECKPOINT_DSN", "POSTGRES_PASSWORD")
          assert not any(name in os.environ for name in owner_variables)
          dsn = ApiSettings().postgres_dsn
          assert dsn is not None
          with psycopg.connect(dsn.get_secret_value(), connect_timeout=5) as connection:
              assert connection.execute("SELECT current_user").fetchone() == ("invoiceops_app",)
              assert connection.execute(
                  "SELECT has_table_privilege(current_user, 'public.ledger', 'UPDATE,DELETE,TRUNCATE')"
              ).fetchone() == (False,)
          PY
          docker compose run --rm seed
          docker compose run --rm seed
          docker compose exec -T api python - <<'PY'
          import psycopg
          from invoiceops_agent.api.settings import ApiSettings

          dsn = ApiSettings().postgres_dsn
          assert dsn is not None
          with psycopg.connect(dsn.get_secret_value(), connect_timeout=5) as connection:
              counts = tuple(connection.execute(f"SELECT count(*) FROM public.{table}").fetchone()[0]
                             for table in ("vendors", "purchase_orders", "goods_receipts"))
          assert counts == (12, 24, 12), counts
          PY

      - name: Start UI and verify API proxy
        timeout-minutes: 3
        run: |
          docker compose --profile ui up -d --build --wait --wait-timeout 120 ui
          curl --retry 10 --retry-delay 1 --fail --silent --show-error http://localhost:5173/
          curl --retry 10 --retry-delay 1 --fail --silent --show-error http://localhost:5173/healthz

      - name: Browser review smoke
        timeout-minutes: 5
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Accept and replay an authenticated Compose upload
        timeout-minutes: 1
        run: |
          docker compose exec -T api python - <<'PY'
          import httpx
          from invoiceops_agent.api.settings import ApiSettings

          settings = ApiSettings()
          assert settings.service_token is not None
          headers = {
              "Authorization": f"Bearer {settings.service_token.get_secret_value()}",
              "Idempotency-Key": "ci-upload-1",
          }
          files = {"file": ("synthetic.pdf", b"%PDF-1.7\nsynthetic CI invoice\n%%EOF", "application/pdf")}
          with httpx.Client(base_url="http://127.0.0.1:8000", timeout=10) as client:
              rejected = client.post("/v1/invoices", headers={"Idempotency-Key": "ci-auth"})
              assert rejected.status_code == 401
              accepted = client.post("/v1/invoices", headers=headers, files=files)
              replay = client.post("/v1/invoices", headers=headers, files=files)
              assert accepted.status_code == replay.status_code == 201
              assert accepted.json() == replay.json()
              assert accepted.json()["status"] == "QUEUED"
              duplicate_headers = {**headers, "Idempotency-Key": "ci-duplicate-1"}
              duplicate = client.post("/v1/invoices", headers=duplicate_headers, files=files)
              duplicate_replay = client.post("/v1/invoices", headers=duplicate_headers, files=files)
              assert duplicate.status_code == duplicate_replay.status_code == 200
              assert duplicate.json() == duplicate_replay.json()
              assert duplicate.json() == {**accepted.json(), "duplicate": True}
          PY

      - name: Accept and replay a signed synthetic email webhook
        timeout-minutes: 1
        run: |
          docker compose exec -T api python - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import time

          import httpx
          from invoiceops_agent.api.settings import ApiSettings

          settings = ApiSettings()
          assert settings.webhook_secret is not None
          raw = json.dumps({"attachment": {
              "content_type": "application/pdf",
              "content_base64": base64.b64encode(b"%PDF-1.7\nsynthetic CI email\n%%EOF").decode(),
          }}, separators=(",", ":")).encode()
          timestamp = str(int(time.time()))

          def headers(nonce):
              signature = hmac.new(
                  settings.webhook_secret.get_secret_value().encode(),
                  timestamp.encode() + b"." + nonce.encode() + b"." + raw,
                  hashlib.sha256,
              ).hexdigest()
              return {"Content-Type": "application/json", "Idempotency-Key": "ci-email-1",
                      "X-Webhook-Timestamp": timestamp, "X-Webhook-Nonce": nonce,
                      "X-Webhook-Signature": signature}

          with httpx.Client(base_url="http://127.0.0.1:8000", timeout=10) as client:
              accepted = client.post("/v1/invoices/email-webhook", headers=headers("ci-email-nonce-0001"), content=raw)
              replay = client.post("/v1/invoices/email-webhook", headers=headers("ci-email-nonce-0002"), content=raw)
              reused = client.post("/v1/invoices/email-webhook", headers=headers("ci-email-nonce-0001"), content=raw)
              assert accepted.status_code == replay.status_code == 201
              assert accepted.json() == replay.json()
              assert reused.status_code == 409
          PY

      - name: Persist and replay the Compose hello graph
        timeout-minutes: 2
        run: |
          docker compose run --rm graph-demo invoiceops-graph-demo \
            --run-id 00000000-0000-4000-8000-000000000001 \
            --invoice-id 00000000-0000-4000-8000-000000000002
          docker compose run --rm graph-demo invoiceops-graph-demo \
            --run-id 00000000-0000-4000-8000-000000000001 \
            --invoice-id 00000000-0000-4000-8000-000000000002

      - name: Recorded golden pipeline smoke
        timeout-minutes: 3
        env:
          LITELLM_API_BASE: http://cassette.invalid/v1
          LITELLM_MASTER_KEY: synthetic-replay-only
          LITELLM_MODEL: recorded-fixture-model
        run: |
          uv run --no-sync python -m eval.runners.build_smoke_cassettes
          uv run --no-sync python -m eval.runners.run_pipeline --recorded --no-start \
            --output eval/data/runs/ci-recorded-smoke.json
          uv run --no-sync python - <<'PY'
          import json

          report = json.load(open("eval/data/runs/ci-recorded-smoke.json"))
          sample = report["samples"][0]
          assert report["mode"] == "recorded" and len(report["samples"]) == 1
          assert sample["route"] == "AUTO_APPROVE"
          assert sample["detail"]["invoice"]["status"] == "APPROVED"
          assert sample["detail"]["invoice"]["run_status"] == "COMPLETED"
          assert sample["worker_error_type"] is None
          assert sample["replayed_before_worker"] is False
          ocr = sample["detail"]["evidence"]["extraction.completed"]["identifier_ocr"]
          assert ocr["status"] == "COMPLETE"
          assert ocr["engine_version"].startswith("tesseract ")
          assert [event["event_type"] for event in sample["provenance"]["events"]] == [
              "ingest.accepted", "extraction.completed", "validation.completed",
              "matching.completed", "similarity.completed", "classification.completed",
              "policy.completed", "gate.completed", "approval.auto_granted",
              "workflow.archived",
          ]
          PY

      - name: Compose diagnostics
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up Compose services
        if: always()
        run: docker compose down --volumes --remove-orphans

  eval-gate:
    name: Golden eval gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      UV_PYTHON: "3.12"
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPORT_PATH: eval/reports/golden-v1.0.1-openai-prod.json
    steps:
      - name: Check out repository and main baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.25"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Compare live primary reports
        run: |
          if [ ! -f "$REPORT_PATH" ]; then
            if git cat-file -e "$BASE_SHA:$REPORT_PATH" 2>/dev/null; then
              echo "The PR removed the live golden report." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "Live gate awaits the first measured 500-invoice report; recorded smoke cannot be used as quality evidence." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p eval/data/runs
          if git cat-file -e "$BASE_SHA:$REPORT_PATH" 2>/dev/null; then
            git show "$BASE_SHA:$REPORT_PATH" > eval/data/runs/main-primary.json
          else
            cp "$REPORT_PATH" eval/data/runs/main-primary.json
            echo "Bootstrapping the first live baseline: enforce all floors now; regression comparisons begin after merge." >> "$GITHUB_STEP_SUMMARY"
          fi
          if ! uv run --no-sync python -m eval.ci_gate \
            --baseline eval/data/runs/main-primary.json \
            --candidate "$REPORT_PATH" \
            --comment-file eval/data/runs/ci-gate.md \
            --output eval/data/runs/ci-gate.json; then
            if [ ! -s eval/data/runs/ci-gate.md ]; then
              printf '%s\n' '### Golden evaluation gate: FAIL' '' 'The live report is incomplete or invalid. Check the CI gate log for the exact evidence error.' > eval/data/runs/ci-gate.md
            fi
            cat eval/data/runs/ci-gate.md >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat eval/data/runs/ci-gate.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR with metric deltas
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s eval/data/runs/ci-gate.md ]; then
            gh pr comment "$PR_NUMBER" --body-file eval/data/runs/ci-gate.md
          fi
