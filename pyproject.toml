[project]
name = "invoiceops-agent"
version = "0.1.0"
description = "Agentic invoice processing with deterministic controls and auditable decisions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "langgraph==1.2.12",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary,pool]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "uvicorn==0.53.0",
]

[project.scripts]
invoiceops-graph-demo = "invoiceops_agent.graph.cli:main"

[build-system]
requires = ["uv_build==0.11.25"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = ["src"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = ["error"]
markers = [
    "unit: deterministic offline tests with mocked external dependencies",
    "integration: tests requiring Postgres, MinIO, or other local infrastructure",
    "eval: explicit evaluation runs; live model calls are restricted to CI",
]

[dependency-groups]
dev = [
    "minio==7.2.20",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-socket==0.8.1",
    "ruff==0.16.8",
    "testcontainers==4.15.0",
    "urllib3==2.8.0",
]
